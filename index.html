<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Waveless | Vive tus propias aventuras</title>
    <meta
      name="description"
      content="Para los que les gusta explorar y conocer mundo sin complejos. Encuentra tu próxima aventura con Waveless."
    >
    <meta name="theme-color" content="#622f60">
    <link rel="canonical" href="https://wavesforweirdos.github.io/waveless-home/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_ES">
    <meta property="og:site_name" content="Waveless">
    <meta property="og:url" content="https://wavesforweirdos.github.io/waveless-home/">
    <meta property="og:title" content="Waveless | Vive tus propias aventuras">
    <meta
      property="og:description"
      content="Para los que les gusta explorar y conocer mundo sin complejos. Encuentra tu próxima aventura con Waveless."
    >
    <meta property="og:image" content="https://wavesforweirdos.github.io/waveless-home/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Logo de Waveless">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link
      rel="preload"
      href="/fonts/syne-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    >
    <link
      rel="preload"
      href="/fonts/nunito-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    >
    <script>
      // Si el módulo no carga, los estilos que dependen de JavaScript se desactivan (ver tools/_enhance.scss).
      addEventListener(
        'error',
        (event) => {
          if (event.target instanceof HTMLScriptElement) {
            document.documentElement.setAttribute('data-js-failed', '');
          }
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    {{> home/home}}
  </body>
</html>
